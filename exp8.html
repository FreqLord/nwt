<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8</title>
    <style>
        /* Light Theme: Seedhe standard names */
        body { 
            font-family: Arial; 
            text-align: center; 
            background: lightgray; 
            color: black; 
            padding: 50px; 
            transition: 0.3s; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            display: inline-block; 
            box-shadow: 0 4px 8px gray; 
        }
        input, button { 
            padding: 10px; 
            margin: 5px; 
            font-size: 14px; 
        }
        button { 
            background: blue; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        
        /* Dark Theme: black, white, aur 222 / 333 */
        .dark { 
            background: black; 
            color: white; 
        }
        .dark .card { 
            background: #222; 
            color: white; 
        }
        .dark input { 
            background: #333; 
            color: white; 
            border: 1px solid gray; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Interactive Web Page</h2>
        <input type="text" id="name" placeholder="Enter your name"><br>
        <button onclick="displayMessage()">Greet Me</button>
        <button onclick="toggleTheme()">Toggle Theme</button>
        <p id="msg"></p>
    </div>

    <script>
        function displayMessage() {
            let name = document.getElementById("name").value;
            document.getElementById("msg").innerHTML = name ? "Hello, " + name + "!" : "Please enter a name!";
        }

        function toggleTheme() {
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
